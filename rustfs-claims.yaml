apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data-pvc
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: rustfs-data-pv
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-logs-pvc
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: rustfs-logs-pv
  resources:
    requests:
      storage: 1Gi
