apiVersion: v1
kind: PersistentVolume
metadata: 
  name: homelab-nfs-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: homelab-nfs
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.10
    path: /mnt/storage/nfs/shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-shared-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: homelab-nfs
  resources:
    requests:
      storage: 500Gi
