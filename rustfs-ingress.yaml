apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-admin
  namespace: rustfs
spec:
  ingressClassName: traefik
  rules:
    - host: rustfs.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  number: 9001
